name: Research replay
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-recorded.txt
      - run: python code/verify_manifest.py
      - run: sh reproduce.sh
      - run: python code/publication_controls.py
      - run: python -OO code/publication_controls.py
